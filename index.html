<body class="pp">
<div id="app">
  <div id="offline" class="offline" hidden></div>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button data-tab="bots"><svg viewBox="0 0 24 24"><g transform="rotate(30 12 12)"><path d="M12 2.4c2.6 2.2 3.6 5.4 3.6 8.7V16H8.4v-4.9c0-3.3 1-6.5 3.6-8.7z"/><circle cx="12" cy="9.4" r="1.6"/><path d="M8.4 12.4 5.5 15.5v2.3l2.9-1.5M15.6 12.4l2.9 3.1v2.3l-2.9-1.5"/><path d="M10.1 16l-.7 2.4h5.2l-.7-2.4"/></g></svg><span>Bots</span></button>
    <button data-tab="activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span>Activity</span></button>
    <button data-tab="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Account</span></button>
  </nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="full" class="full" hidden></div>
  <div id="toast" class="toast" hidden></div>
</div>
<script>
(function () {
  var V = "desk-shell-v23-tick";
  window.__PP_SHELL = V;
  if (!("serviceWorker" in navigator) || location.protocol !== "https:") return;
  var once = 0;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (once++) return;
    location.reload();
  });
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (reg) {
    if (reg.waiting) reg.waiting.postMessage("SKIP_WAITING");
    if (reg.update) reg.update();
  }).catch(function () {});
  fetch("sw.js?ppver=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
    var m = t.match(/desk-shell-v[A-Za-z0-9-]+/);
    if (m && m[0] !== V && sessionStorage.getItem("pp-sw") !== m[0]) {
      sessionStorage.setItem("pp-sw", m[0]);
      location.reload();
    }
  }).catch(function () {});
})();
</script>
<script src="desk-crypto.js"></script>
