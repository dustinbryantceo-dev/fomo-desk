<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pump Pilot">
<meta name="application-name" content="Pump Pilot">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#05070b">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Pump Pilot</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body class="pp">
<div id="app">
  <div id="offline" class="offline" hidden></div>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button data-tab="bots"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"/><circle cx="9" cy="13" r="1.6"/><circle cx="15" cy="13" r="1.6"/><path d="M12 3v4"/></svg><span>Bots</span></button>
    <button data-tab="activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span>Activity</span></button>
    <button data-tab="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Account</span></button>
  </nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="full" class="full" hidden></div>
  <div id="toast" class="toast" hidden></div>
</div>
<script src="desk-crypto.js"></script>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
