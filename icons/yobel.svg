    <ellipse cx="393" cy="320" rx="19" ry="80" transform="rotate(8 393 320)" fill="#241257"/>
    <ellipse cx="393" cy="320" rx="19" ry="80" transform="rotate(8 393 320)" fill="none" stroke="#ffe7a1" stroke-width="7"/>
    <path d="M150 164 C204 140 270 148 322 182" fill="none" stroke="#fff7dd" stroke-width="5" stroke-linecap="round" opacity=".6"/>
