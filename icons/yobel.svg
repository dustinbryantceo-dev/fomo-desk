<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#3b1f9e"/><stop offset=".45" stop-color="#150f45"/><stop offset="1" stop-color="#070818"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0c2"/><stop offset=".35" stop-color="#f5c76b"/><stop offset="1" stop-color="#c8921f"/>
    </linearGradient>
    <linearGradient id="goldd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8741a"/><stop offset="1" stop-color="#e2b649"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- city bokeh -->
  <g opacity=".85">
